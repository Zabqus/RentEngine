spring:
  application:
    name: rentengine
  # .env leży w głównym folderze repo; drugi wpis na wypadek uruchamiania z RentEngine/
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # API zawsze po angielsku, niezależnie od Accept-Language i języka systemu
  web:
    locale: en
    locale-resolver: fixed

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT24H}

springdoc:
  swagger-ui:
    # Token zostaje po odświeżeniu strony
    persist-authorization: true
    tags-sorter: alpha
