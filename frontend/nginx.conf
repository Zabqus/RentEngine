server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Zdjęcia uszkodzeń do 5 MB (backend: max-request-size 6MB)
    client_max_body_size 6m;

    # API pod tym samym adresem co frontend, więc bez CORS (jak proxy w Vite)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pliki z hashem w nazwie można cache'ować długo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Trasy React Routera (np. /rentals/5) zwracają index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
